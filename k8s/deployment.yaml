apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-webapp
  labels:
    app: ci-cd-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-cd-webapp
  template:
    metadata:
      labels:
        app: ci-cd-webapp
    spec:
      containers:
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-webapp-service
spec:
  type: NodePort
  selector:
    app: ci-cd-webapp
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
